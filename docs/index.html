<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>urdfeus model gallery</title>
<style>
  :root{
    --bg:#13151a; --panel:#1d2026; --panel2:#23272f; --line:#2e333d;
    --text:#e6e8ec; --muted:#9aa3b2; --accent:#4ea1ff; --accent2:#2bd4a7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
  a{color:inherit}
  /* top bar */
  #bar{position:sticky;top:0;z-index:5;background:rgba(19,21,26,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:12px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  #bar h1{font-size:16px;margin:0;font-weight:650;white-space:nowrap}
  #bar h1 span{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
  #bar .convert{margin-left:auto;color:var(--accent);text-decoration:none;font-size:13px;
    border:1px solid var(--line);border-radius:6px;padding:6px 12px;white-space:nowrap}
  #bar .convert:hover{border-color:var(--accent)}
  .search{flex:1;min-width:180px;padding:9px 12px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:14px;outline:none}
  .search:focus{border-color:var(--accent)}
  .chips{display:flex;gap:6px}
  .chip{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);
    color:var(--muted);font-size:13px;cursor:pointer;user-select:none;white-space:nowrap}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:600}
  /* grid */
  #grid{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:.12s}
  .card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .thumb{width:100%;height:168px;background:#0f1115 center/contain no-repeat;display:block}
  .meta{padding:9px 11px}
  .meta .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta .mt{font-size:11px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px}
  .badge{font-size:10px;padding:2px 7px;border-radius:5px}
  .b-robot{background:#2a3550;color:#9cc2ff}.b-object{background:#2a4338;color:#86e6bd}.b-scene{background:#4a3320;color:#f0b878}
  #count2{padding:0 18px 24px;color:var(--muted);font-size:12px}
  /* viewer overlay */
  #viewer{position:fixed;inset:0;z-index:20;background:#0f1115;display:none}
  #viewer.show{display:block}
  #view{width:100%;height:100%;display:block}
  #back{position:absolute;left:16px;top:14px;background:rgba(29,32,38,.92);border:1px solid var(--line);
    color:var(--text);border-radius:9px;padding:8px 14px;font-size:13px;cursor:pointer;backdrop-filter:blur(6px)}
  #back:hover{border-color:var(--accent)}
  #tools{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:flex;gap:8px;z-index:2}
  .tbtn{background:rgba(29,32,38,.92);border:1px solid var(--line);color:var(--text);border-radius:9px;
    padding:8px 12px;font-size:13px;cursor:pointer;backdrop-filter:blur(6px)}
  .tbtn:hover{border-color:var(--accent)} .tbtn.on{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:600}
  .tbtn.disabled{opacity:.4;pointer-events:none}
  #vtitle{position:absolute;left:120px;top:50px;font-size:15px;font-weight:600;text-shadow:0 1px 4px #000;pointer-events:none}
  #vtitle small{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px}
  #panel{position:absolute;right:14px;top:14px;width:248px;max-height:calc(100% - 28px);
    background:rgba(29,32,38,.94);border:1px solid var(--line);border-radius:11px;backdrop-filter:blur(6px);
    display:flex;flex-direction:column;overflow:hidden}
  #panel .ph{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  #panel .ph b{font-size:13px}#panel .ph button{font-size:12px;background:var(--panel2);color:var(--text);
    border:1px solid var(--line);border-radius:7px;padding:4px 10px;cursor:pointer}
  #joints{overflow:auto;padding:8px 12px}
  .jrow{margin:9px 0}.jrow label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
  .jrow input[type=range]{width:100%;accent-color:var(--accent)}
  .hint{position:absolute;left:16px;bottom:14px;color:var(--muted);font-size:12px;text-shadow:0 1px 3px #000}
  #legend{position:absolute;right:14px;bottom:14px;display:none;flex-direction:column;gap:4px;
    background:rgba(29,32,38,.9);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:12px;backdrop-filter:blur(6px)}
  #legend span{display:flex;align-items:center;gap:7px;color:var(--text)}
  #legend i{width:11px;height:11px;border-radius:50%;display:inline-block}
  #legend .lg-axes{color:var(--muted);font-size:11px;margin-top:2px}
  .flabel{font-size:11px;font-weight:600;color:#fff;background:rgba(20,22,28,.82);border:1px solid var(--line);
    border-radius:6px;padding:2px 7px;white-space:nowrap;transform:translate(-50%,-185%);text-shadow:0 1px 2px #000}
  .flabel.handle{border-color:#2bd4a7}.flabel.attention{border-color:#ffb454}
  #spin{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--accent);font-size:14px}
  #tip{position:absolute;display:none;z-index:3;pointer-events:none;background:rgba(20,22,28,.95);
    border:1px solid var(--accent);border-radius:7px;padding:4px 9px;font-size:12.5px;font-weight:600;
    color:#fff;white-space:nowrap;text-shadow:0 1px 2px #000;transform:translate(12px,12px)}
  @media(max-width:560px){#panel{width:200px}.thumb{height:140px}}
</style>
</head>
<body>
  <div id="bar">
    <h1>urdfeus gallery <span id="count"></span></h1>
    <input id="q" class="search" placeholder="Search (e.g. pr2, kettle, room610, humanoid) ...">
    <div class="chips" id="chips">
      <div class="chip on" data-k="all">All</div>
      <div class="chip" data-k="robot">Robots</div>
      <div class="chip" data-k="object">Objects</div>
      <div class="chip" data-k="scene">Scenes</div>
    </div>
    <a class="convert" href="convert/">Convert your own URDF &rarr;</a>
  </div>
  <div id="grid"></div>
  <div id="count2"></div>

  <div id="viewer">
    <canvas id="view"></canvas>
    <button id="back">← Back to list</button>
    <div id="tools">
      <button id="t-frames" class="tbtn" title="Show grasp (handle) / attention frames">⊹ Frames</button>
      <button id="t-move" class="tbtn" title="Click an object to move / rotate it">✥ Move</button>
      <button id="t-rot" class="tbtn" title="Toggle translate / rotate">⟳ Rotate</button>
      <button id="t-dl" class="tbtn" title="Download this model's ROS package as a zip">⬇ Download</button>
    </div>
    <div id="vtitle"></div>
    <div id="panel" style="display:none">
      <div class="ph"><b>Joints</b><button id="reset">Reset</button></div>
      <div id="joints"></div>
    </div>
    <div class="hint">Drag = rotate / Wheel = zoom / Right-drag = pan · Hover an object for its name / markers = grasp frames</div>
    <div id="legend">
      <span><i style="background:#2bd4a7"></i>✊ handle (grasp pose)</span>
      <span><i style="background:#ffb454"></i>👁 attention (focus point)</span>
      <span class="lg-axes">RGB axes = X/Y/Z</span>
    </div>
    <div id="spin">Loading…</div>
    <div id="tip"></div>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "urdf-loader": "https://cdn.jsdelivr.net/npm/urdf-loader@0.12.7/src/URDFLoader.js",
    "jszip": "https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import URDFLoader from 'urdf-loader';
import JSZip from 'jszip';

// Meshes are Draco-compressed glb (KHR_draco_mesh_compression); a shared
// decoder lets GLTFLoader read them. Served from the same three.js version.
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');

const MODELS_BASE = 'models';
const $ = s => document.querySelector(s);

// ---------- three.js ----------
const canvas = $('#view');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, logarithmicDepthBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const labelRenderer = new CSS2DRenderer();
labelRenderer.domElement.style.cssText='position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1';
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0f1115);
const camera = new THREE.PerspectiveCamera(50,1,0.01,2000); camera.up.set(0,0,1);
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping=true;
// Built-in dolly is applied instantly (damping only smooths rotate/pan), so the
// wheel jumps the view in big steps. Drive zoom ourselves and ease toward a
// target distance each frame for a smooth, glide-y zoom.
controls.enableZoom=false;
let zoomTarget=null;          // desired camera distance to target; null = follow actual
const _zoomVec=new THREE.Vector3();
renderer.domElement.addEventListener('wheel', ev=>{
  if(!current) return;
  ev.preventDefault();
  const cur=camera.position.distanceTo(controls.target);
  const base=(zoomTarget==null)?cur:zoomTarget;
  const step=Math.max(-1,Math.min(1,ev.deltaY/100));   // normalize across mice/trackpads
  zoomTarget=THREE.MathUtils.clamp(base*Math.pow(1.18,step), camera.near*2, camera.far*0.9);
}, {passive:false});
const tcontrols = new TransformControls(camera, renderer.domElement);
tcontrols.addEventListener('dragging-changed', e=>{controls.enabled=!e.value;});
scene.add(tcontrols);
const raycaster = new THREE.Raycaster();
scene.add(new THREE.HemisphereLight(0xffffff,0x444455,1.15));
const dir = new THREE.DirectionalLight(0xffffff,2.0); dir.position.set(3,2,5); scene.add(dir);
const ground = new THREE.GridHelper(10,20,0x335577,0x223044); ground.rotation.x=Math.PI/2; scene.add(ground);
$('#viewer').appendChild(labelRenderer.domElement);
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;
  if(w&&h&&(canvas.width!==w||canvas.height!==h)){renderer.setSize(w,h,false);labelRenderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}}
function animate(){resize();controls.update();
  if(zoomTarget!=null){   // ease camera distance toward the wheel-set target
    const cur=camera.position.distanceTo(controls.target);
    const next=THREE.MathUtils.lerp(cur,zoomTarget,0.18);
    _zoomVec.copy(camera.position).sub(controls.target).setLength(next).add(controls.target);
    camera.position.copy(_zoomVec);
    if(Math.abs(next-zoomTarget)<zoomTarget*1e-3) zoomTarget=null;   // settled
  }
  renderer.render(scene,camera);labelRenderer.render(scene,camera);requestAnimationFrame(animate);}
animate();

let current=null, modelName=null, currentEntry=null, frameMarkers=[], hoverTargets=[], showFrames=true, moveMode=false, rotMode=false, prefixMap={};
function clearModel(){
  tcontrols.detach(); frameMarkers=[]; hoverTargets=[];
  if(current){scene.remove(current);current.traverse(o=>{if(o.geometry)o.geometry.dispose();});current=null;}
}
// URDF-style xyz + rpy (fixed-axis Rz*Ry*Rx == intrinsic ZYX) -> Matrix4
function poseMatrix(xyz,rpy){
  const e=new THREE.Euler(rpy[0],rpy[1],rpy[2],'ZYX');
  return new THREE.Matrix4().makeRotationFromEuler(e).setPosition(xyz[0],xyz[1],xyz[2]);
}
function frameMarker(size,kind,name){
  const g=new THREE.Group();
  const ax=new THREE.AxesHelper(size);            // RGB = frame orientation (X/Y/Z)
  ax.material.depthTest=false; ax.material.depthWrite=false; ax.renderOrder=998;
  ax.material.linewidth=2;
  g.add(ax);
  const col=kind==='handle'?0x2bd4a7:0xffb454;    // handle=teal, attention=orange
  const s=new THREE.Mesh(new THREE.SphereGeometry(size*0.34,16,16),
    new THREE.MeshBasicMaterial({color:col,depthTest:false,depthWrite:false}));
  s.renderOrder=999;
  g.add(s);
  // name label, shown only on hover (keeps busy scenes uncluttered)
  const div=document.createElement('div'); div.className='flabel '+kind;
  div.textContent=(kind==='handle'?'✊ ':'👁 ')+name.replace(/^o\d+_/,'');
  const lab=new CSS2DObject(div); lab.position.set(0,0,0); lab.visible=false; g.add(lab);
  hoverTargets.push({sphere:s, label:lab});
  return g;
}
function loadFrames(robot){
  fetch(`${MODELS_BASE}/${modelName}/frames.json`).then(r=>r.ok?r.json():[]).then(frames=>{
    if(!current||!frames.length){ setBtn('#t-frames',false,true); return; }
    const box=new THREE.Box3().setFromObject(robot); const sz=box.getSize(new THREE.Vector3());
    const md=Math.max(sz.x,sz.y,sz.z)||1;
    const size=Math.min(Math.max(md*0.13,0.07),0.35);   // grasp-scale, capped
    for(const f of frames){
      const m=frameMarker(size,f.kind,f.name); m.applyMatrix4(poseMatrix(f.xyz,f.rpy)); m.visible=showFrames;
      const host=(f.parent&&robot.links&&robot.links[f.parent])?robot.links[f.parent]:robot;
      host.add(m); frameMarkers.push(m);
    }
    document.querySelector('#t-frames').classList.remove('disabled');
    applyFrames();   // frames shown by default
  }).catch(()=>setBtn('#t-frames',false,true));
}
function setBtn(sel,on,disabled){
  const b=document.querySelector(sel); b.classList.toggle('on',!!on); b.classList.toggle('disabled',!!disabled);
}
function frame(obj){
  const box=new THREE.Box3().setFromObject(obj); if(box.isEmpty())return;
  const c=box.getCenter(new THREE.Vector3()), s=box.getSize(new THREE.Vector3());
  const r=Math.max(s.x,s.y,s.z)||1;
  controls.target.copy(c);
  camera.position.set(c.x+r*1.3,c.y-r*1.6,c.z+r*1.1);
  camera.near=r/100; camera.far=r*60; camera.updateProjectionMatrix();
  zoomTarget=null;   // start following the freshly framed distance
  ground.position.set(c.x,c.y,box.min.z); ground.scale.setScalar(Math.max(1,r*2)/10*1.6);
}
function loadModel(e){
  currentEntry=e;
  $('#viewer').classList.add('show'); $('#spin').style.display='flex';
  $('#vtitle').innerHTML=`${e.name}<small>${e.kind} · ${e.links} links · ${e.movable} movable joints</small>`;
  const manager=new THREE.LoadingManager();
  const loader=new URDFLoader(manager);
  loader.packages=(pkg)=>`${MODELS_BASE}/${pkg}`;
  loader.loadMeshCb=(path,mgr,done)=>{ const gl=new GLTFLoader(mgr); gl.setDRACOLoader(dracoLoader); gl.load(path,g=>{
    g.scene.traverse(o=>{if(o.isMesh){o.material.metalness=0;o.material.roughness=0.85;}}); done(g.scene);
  },undefined,err=>done(null,err)); };
  loader.load(`${MODELS_BASE}/${e.name}/${e.urdf}`, robot=>{
    clearModel(); current=robot; modelName=e.name; scene.add(robot);
    showFrames=true; setMove(false); setBtn('#t-frames',false,true);
    manager.onLoad=()=>{frame(robot);$('#spin').style.display='none';};
    setTimeout(()=>{if($('#spin').style.display!=='none'){frame(robot);$('#spin').style.display='none';}},1500);
    buildJoints(robot);
    loadFrames(robot);
    prefixMap={};
    fetch(`${MODELS_BASE}/${e.name}/objects.json`).then(r=>r.ok?r.json():[])
      .then(objs=>{ for(const o of objs) prefixMap[o.prefix]=o.name; }).catch(()=>{});
  }, undefined, err=>{$('#spin').textContent='Load failed';console.error(err);});
}
// name of the object under a hovered mesh (scene: per-object; else model name)
function objectNameOf(mesh){
  let o=mesh;
  while(o){ if(o.name){ const m=o.name.match(/^(o\d+_)/); if(m&&prefixMap[m[1]]) return prefixMap[m[1]]; } o=o.parent; }
  return modelName;
}
function showTip(t,x,y){ const e=$('#tip'); e.textContent=t; e.style.left=x+'px'; e.style.top=y+'px'; e.style.display='block'; }
function hideTip(){ $('#tip').style.display='none'; }
// ---- toolbar: frames toggle + move/rotate gizmo ----
function applyFrames(){
  frameMarkers.forEach(m=>m.visible=showFrames);
  hoverTargets.forEach(t=>t.label.visible=false);   // labels are hover-only
  labelRenderer.domElement.style.display=showFrames?'block':'none';
  $('#legend').style.display=(showFrames&&frameMarkers.length)?'flex':'none';
  document.querySelector('#t-frames').classList.toggle('on',showFrames);
}
$('#t-frames').onclick=()=>{ if(!frameMarkers.length)return; showFrames=!showFrames; applyFrames(); };
// hover: show a frame's name label (on its marker) + the object name tooltip
renderer.domElement.addEventListener('pointermove', ev=>{
  if(!current||!controls.enabled){return;}
  const r=renderer.domElement.getBoundingClientRect();
  const ndc=new THREE.Vector2(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
  raycaster.setFromCamera(ndc,camera);
  let frameHit=null;
  if(showFrames&&hoverTargets.length){
    const h=raycaster.intersectObjects(hoverTargets.map(t=>t.sphere),false)[0];
    frameHit=h?h.object:null;
    for(const t of hoverTargets) t.label.visible=(t.sphere===frameHit);
  }
  if(frameHit){ hideTip(); return; }                 // grasp frame takes priority
  const mh=raycaster.intersectObject(current,true).find(x=>x.object.isMesh);
  if(mh) showTip(objectNameOf(mh.object), ev.clientX, ev.clientY); else hideTip();
});
renderer.domElement.addEventListener('pointerleave', ()=>{ hoverTargets.forEach(t=>t.label.visible=false); hideTip(); });
function setMove(on){ moveMode=on; setBtn('#t-move',on,false); if(!on)tcontrols.detach();
  document.querySelector('#t-rot').classList.toggle('disabled',!on); renderer.domElement.style.cursor=on?'crosshair':''; }
$('#t-move').onclick=()=>setMove(!moveMode);
$('#t-rot').onclick=()=>{ if(!moveMode)return; rotMode=!rotMode; tcontrols.setMode(rotMode?'rotate':'translate');
  document.querySelector('#t-rot').classList.toggle('on',rotMode); };
// Download the current model's ROS package as a zip, built in-browser from the
// per-model file list in the manifest (no server needed for GitHub Pages).
async function downloadPackage(){
  const e=currentEntry; if(!e) return;
  const files=e.files||[]; if(!files.length){ alert('No downloadable file list for this model'); return; }
  const btn=$('#t-dl'); const label=btn.textContent; btn.classList.add('disabled'); btn.textContent='⬇ …';
  try{
    const zip=new JSZip(); const root=zip.folder(e.name);
    const base=`${MODELS_BASE}/${e.name}`;
    let done=0;
    await Promise.all(files.map(async rel=>{
      const res=await fetch(`${base}/${rel}`);
      if(!res.ok) throw new Error(`${rel}: HTTP ${res.status}`);
      root.file(rel, await res.arrayBuffer());
      btn.textContent=`⬇ ${++done}/${files.length}`;
    }));
    const blob=await zip.generateAsync({type:'blob', compression:'DEFLATE', compressionOptions:{level:6}});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=`${e.name}.zip`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  }catch(err){ alert('Download failed: '+err.message); }
  finally{ btn.classList.remove('disabled'); btn.textContent=label; }
}
$('#t-dl').onclick=downloadPackage;
// pick an object to attach the gizmo (top-level group under the robot root)
renderer.domElement.addEventListener('pointerdown', ev=>{
  if(!moveMode||!current||ev.button!==0)return;
  const r=renderer.domElement.getBoundingClientRect();
  const ndc=new THREE.Vector2(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
  raycaster.setFromCamera(ndc,camera);
  const hits=raycaster.intersectObject(current,true).filter(h=>h.object.isMesh);
  if(!hits.length){ tcontrols.detach(); return; }
  let o=hits[0].object; // walk up to the direct child of the robot root = the object/link group
  while(o.parent && o.parent!==current && o.parent!==scene) o=o.parent;
  tcontrols.attach(o); tcontrols.setMode(rotMode?'rotate':'translate');
});
function buildJoints(robot){
  const panel=$('#panel'), box=$('#joints'); box.innerHTML='';
  const js=Object.values(robot.joints).filter(j=>j.jointType!=='fixed');
  if(!js.length){panel.style.display='none';return;}
  panel.style.display='flex'; js.sort((a,b)=>a.name.localeCompare(b.name));
  for(const j of js){
    const cont=j.jointType==='continuous';
    let lo=cont?-Math.PI:Number(j.limit.lower), hi=cont?Math.PI:Number(j.limit.upper);
    if(!(hi>lo)){lo=-Math.PI;hi=Math.PI;}
    const row=document.createElement('div'); row.className='jrow';
    const lab=document.createElement('label'); const sp=document.createElement('span'); sp.textContent=j.name;
    const v=document.createElement('span'); v.textContent='0.00'; lab.append(sp,v);
    const inp=document.createElement('input'); inp.type='range'; inp.min=lo; inp.max=hi; inp.step=(hi-lo)/200; inp.value=0;
    inp.oninput=()=>{robot.setJointValue(j.name,Number(inp.value));v.textContent=Number(inp.value).toFixed(2);};
    row.append(lab,inp); box.append(row);
  }
}
$('#reset').onclick=()=>{ if(!current)return;
  for(const j of Object.values(current.joints)) current.setJointValue(j.name,0);
  document.querySelectorAll('#joints input').forEach(i=>i.value=0);
  document.querySelectorAll('#joints .jrow label span:last-child').forEach(s=>s.textContent='0.00'); };
function closeViewer(){ $('#viewer').classList.remove('show'); clearModel(); history.replaceState(null,'',location.pathname); }
$('#back').onclick=closeViewer;
addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer();});

// ---------- gallery ----------
let DATA=[], kind='all', q='';
const grid=$('#grid');
function render(){
  const list=DATA.filter(e=>(kind==='all'||e.kind===kind)&&(!q||e.name.toLowerCase().includes(q)));
  $('#count').textContent=`(${list.length}/${DATA.length})`;
  $('#count2').textContent=list.length+' models';
  const frag=document.createDocumentFragment();
  for(const e of list){
    const c=document.createElement('div'); c.className='card';
    const t=document.createElement('div'); t.className='thumb';
    t.style.backgroundImage=`url(thumbnails/${e.name}.webp)`;
    const m=document.createElement('div'); m.className='meta';
    m.innerHTML=`<div class="nm" title="${e.name}">${e.name}</div>
      <div class="mt"><span class="badge b-${e.kind}">${e.kind}</span><span>${e.movable} movable</span></div>`;
    c.append(t,m);
    c.onclick=()=>{history.replaceState(null,'','?m='+encodeURIComponent(e.name)); loadModel(e);};
    frag.append(c);
  }
  grid.replaceChildren(frag);
}
$('#q').oninput=ev=>{q=ev.target.value.toLowerCase();render();};
$('#chips').onclick=ev=>{const t=ev.target.closest('.chip');if(!t)return;
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));t.classList.add('on');kind=t.dataset.k;render();};
fetch('manifest.json').then(r=>r.json()).then(d=>{
  DATA=d; render();
  const m=new URLSearchParams(location.search).get('m');
  if(m){const e=DATA.find(x=>x.name===m); if(e) loadModel(e);}
}).catch(()=>{$('#count').textContent='Failed to load manifest.json';});
</script>
</body>
</html>
