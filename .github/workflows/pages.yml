name: Deploy Pages

# The site used to be served straight from main:/docs with no build step. The
# converter under /convert is a Vite bundle, so Pages now builds from here
# instead; docs/ is still the source of the gallery and is copied in verbatim.
on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The page installs urdfeus into Pyodide. Building the wheel here rather
      # than pulling the last PyPI release keeps the converter in step with
      # this commit -- a new conversion feature works as soon as it is merged.
      - name: Build the urdfeus wheel for the page
        run: |
          python -m pip install --upgrade build
          python tools/build_web_wheel.py

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Test the mesh-matching logic
        working-directory: web
        run: npm test

      - name: Build the converter
        working-directory: web
        run: npm run build

      - name: Assemble the site
        run: |
          mkdir -p _site
          # `docs/.` rather than `docs/*` so .nojekyll comes along.
          cp -r docs/. _site/
          cp -r web/dist _site/convert
          echo "assembled $(find _site -type f | wc -l) files"

      # Cloudflare Web Analytics, inserted into the assembled copies rather than
      # docs/ and web/ so that local builds and dev servers carry no beacon and
      # never count their own visits. The token is printed in every public page,
      # so it is not a secret; it lives here only, not in each HTML file.
      - name: Insert the Cloudflare Web Analytics beacon
        env:
          CF_BEACON_TOKEN: "63496313d65d4ea9b205a875aad06f84"
        run: |
          python - <<'EOF'
          import json
          import os
          import pathlib

          token = os.environ["CF_BEACON_TOKEN"]
          tag = ('<script defer src="https://static.cloudflareinsights.com/beacon.min.js"'
                 f" data-cf-beacon='{json.dumps({'token': token})}'></script>")
          pages = sorted(pathlib.Path("_site").rglob("*.html"))
          for page in pages:
              html = page.read_text()
              if "cloudflareinsights" in html:
                  continue
              if html.count("</head>") != 1:
                  raise SystemExit(f"{page}: expected exactly one </head>")
              page.write_text(html.replace("</head>", tag + "\n</head>", 1))
              print(f"beacon inserted: {page}")
          if not pages:
              raise SystemExit("no HTML pages found under _site")
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
