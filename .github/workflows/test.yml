name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0, 0,12 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  formatting:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install
      run: pip install ruff
    - name: Run Ruff
      run: ruff check .

  tests-3x:
    name: Run Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing interpreter should not cancel the others: knowing whether a
      # break is version-specific is most of the diagnosis.
      fail-fast: false
      # 3.12 is the newest interpreter open3d ships a wheel for, and 3.13 is
      # the first one it does not; running both is what keeps the optional
      # extra honest as interpreters move on.
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        os: [ubuntu-22.04]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install APT On Linux
      run: |
        sudo apt-get update -qq -y
        sudo apt-get install -qq -y libspatialindex-dev freeglut3-dev libsuitesparse-dev libblas-dev liblapack-dev
        # Install EusLisp and display dependencies
        sudo apt-get install -qq -y jskeus xvfb
    - name: Fetch the EusLisp models
      # The Debian packages ship the interpreter but no models: jskeus
      # 1.2.4+dfsg-3 installs 1.6 MB and euslisp 9.27+dfsg-7's file list has no
      # models directory at all. So every test that needs a jskeus model -- the
      # eus2urdf sweep and the eus -> URDF -> eus round trip -- skipped here,
      # silently, while passing locally.
      #
      # The models live in two repositories: the robots and objects in
      # euslisp/EusLisp, the irteus demo models in euslisp/jskeus. Lay them out
      # the way a source checkout does, <root>/eus/models beside
      # <root>/irteus/demo, because that is the relation the tests use to find
      # the demo models from the model directory. Blobless sparse clones of the
      # tags the installed packages were built from: 30 MB and a couple of
      # seconds, and the model files match the interpreter that reads them.
      run: |
        root="${{ runner.temp }}/jskeus"
        mkdir -p "$root"
        git clone --depth 1 --filter=blob:none --sparse \
          --branch EusLisp-9.27 https://github.com/euslisp/EusLisp.git \
          "$root/eus"
        git -C "$root/eus" sparse-checkout set models
        git clone --depth 1 --filter=blob:none --sparse \
          --branch 1.2.4 https://github.com/euslisp/jskeus.git "$root/jskeus"
        git -C "$root/jskeus" sparse-checkout set irteus/demo
        mv "$root/jskeus/irteus" "$root/irteus"
        rm -rf "$root/jskeus"
        ls "$root/eus/models"/*-robot.l | wc -l
        echo "JSKEUS_MODELS_DIR=$root/eus/models" >> "$GITHUB_ENV"

    - name: Install Pytest
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install Cython
        pip install pytest hacking
    - name: Install urdfeus
      run: pip install --no-cache-dir .[all]
    - name: Run Pytest
      run: |
        # Set up virtual display for headless testing
        export DISPLAY=:99.0
        Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
        # Set EusLisp environment
        export EUSDIR=/usr/share/euslisp
        # JSKEUS_MODELS_DIR comes from the fetch step above; fail loudly rather
        # than skipping every model test if it is somehow unset or empty.
        which irteusgl
        echo "JSKEUS_MODELS_DIR=${JSKEUS_MODELS_DIR}"
        ls "${JSKEUS_MODELS_DIR}/h3-robot.l"
        # Run tests
        pytest -v tests

  auto-merge:
    needs: [formatting, tests-3x]
    # Ask the API for the labels rather than reading them off
    # github.event.pull_request: that payload is a snapshot taken when the PR
    # was opened, and the bump workflow attaches its labels a moment later, so
    # a job gated on the payload skips whenever it loses that race.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      auto-merge-ok: ${{ steps.labels.outputs.auto-merge-ok }}
      release: ${{ steps.labels.outputs.release }}

    steps:
      - name: Read the labels currently on the PR
        id: labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          names=$(gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --json labels --jq '[.labels[].name]')
          echo "labels: $names"
          for label in auto-merge-ok release; do
            has=$(jq -r --arg l "$label" 'index($l) != null' <<< "$names")
            echo "$label=$has" >> "$GITHUB_OUTPUT"
          done

      - name: Checkout repository
        if: steps.labels.outputs.auto-merge-ok == 'true'
        uses: actions/checkout@v4

      - name: Auto merge PR with auto-merge-ok label
        if: steps.labels.outputs.auto-merge-ok == 'true'
        uses: pascalgn/automerge-action@v0.16.3
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          MERGE_LABELS: "auto-merge-ok"
          MERGE_METHOD: squash
          MERGE_DELETE_BRANCH: true

  released-resolution:
    name: Resolve the published package
    # A wider unit-test matrix cannot catch this. CI installs the checkout, so
    # the resolver can never walk urdfeus itself backwards; installing the
    # published package by name can, and did -- `urdfeus[all]` quietly resolved
    # to 0.0.4 on 3.13 because open3d ships no wheel there, warning instead of
    # failing. Only run where a red build is actionable, not on every PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the published package by name
        run: pip install --no-cache-dir "urdfeus[all]"

      - name: Fail if the resolver did not pick the newest release
        run: |
          python - <<'CHECK'
          import json
          import urllib.request
          from importlib.metadata import version

          with urllib.request.urlopen(
                  "https://pypi.org/pypi/urdfeus/json") as response:
              latest = json.load(response)["info"]["version"]
          installed = version("urdfeus")
          print(f"installed {installed}, latest on PyPI {latest}")
          if installed != latest:
              raise SystemExit(
                  f"urdfeus[all] resolved to {installed}, not {latest}: an"
                  " optional dependency is unsatisfiable on this interpreter"
                  " and the resolver fell back to an older release")
          CHECK

  tag-release:
    runs-on: ubuntu-latest
    needs: auto-merge
    if: needs.auto-merge.outputs.release == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install APT On Linux
        run: |
          sudo apt-get update -qq -y
          sudo apt-get install -qq -y libspatialindex-dev freeglut3-dev libsuitesparse-dev libblas-dev liblapack-dev
          sudo apt-get install -qq -y xvfb # for headless testing

      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install .[all]

      - name: Get version from package
        id: get_version
        run: |
          VERSION=$(python -c "import urdfeus; print(urdfeus.__version__)")
          echo "Detected version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Tag and push release
        run: |
          git tag "v${{ steps.get_version.outputs.version }}"
          git push origin "v${{ steps.get_version.outputs.version }}"

  pypi:
    name: Release To PyPi
    needs: tag-release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    - name: Install publishing dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build
      run: |
        pyproject-build --outdir dist .
    - name: Upload to PyPI
      uses: pypa/gh-action-pypi-publish@master
      with:
        password: ${{ secrets.PYPI_TOKEN }}
